name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
  

# cancel in-progress runs that use the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-manifest:
    # check-manifest is a tool that checks that all files in version control are
    # included in the sdist (unless explicitly excluded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx run check-manifest

  test:
    name: ${{ matrix.platform }} (${{ matrix.python-version }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        platform: [ubuntu-latest, macos-latest, windows-latest]

    env:
      # Pin Windows to Vulkan/lavapipe, matching the lavapipe setup ubuntu already
      # uses. The other two Windows backends are both broken for us: the Mesa
      # OpenGL adapter (installed by setup-headless-display-action, and preferred
      # by wgpu because D3D12/WARP reports device type "CPU") samples 1D float32
      # colormap textures as black, and D3D12 falls back to the FXC shader
      # compiler, which cannot compile the MIP shader's dynamic array indexing.
      # Empty elsewhere, which wgpu treats as unset.
      WGPU_BACKEND_TYPE: ${{ matrix.platform == 'windows-latest' && 'Vulkan' || '' }}

      # Put pytest's tmp_path in the workspace (D:) on Windows. The default,
      # the temp directory on C:, takes about 7 ms to sync a file, and the
      # render tests write a few hundred zarr chunks each: 1.4 s a pyramid
      # against 0.5 s here (scripts/ci_profiling/ci_profiling_investigation.md).
      # A relative path, because pytest splits this like a shell would and a
      # Windows path's backslashes would not survive.
      PYTEST_ADDOPTS: ${{ matrix.platform == 'windows-latest' && '--basetemp=.pytest_basetemp' || '' }}

      # Where spatial-graph (through witty) keeps the C++ modules it compiles on
      # first use; saved between runs by the "Restore compiled graph modules"
      # step below.
      WITTY_CACHE_DIR: ${{ github.workspace }}/.witty_cache

      # spatial-graph >=0.1.0 ships prebuilt rtree wheels,
      # but I was getting incompatible CPython errors.
      SPATIAL_GRAPH_NO_PREBUILT: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Set up headless GUI
        uses: pyvista/setup-headless-display-action@v5
        with:
          qt: true

      - name: Install llvmpipe and lavapipe for offscreen canvas
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update -y -qq
          sudo apt install -y libegl1-mesa-dev libgl1-mesa-dri libxcb-xfixes0-dev mesa-vulkan-drivers

      # The windows runners ship no Vulkan driver (the loader is there, but finds
      # no ICD). This installs lavapipe and registers its ICD under
      # HKLM\SOFTWARE\Khronos\Vulkan\Drivers, so WGPU_BACKEND_TYPE=Vulkan resolves.
      - name: Install lavapipe for offscreen canvas
        if: matrix.platform == 'windows-latest'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_lavapipe: true
          stripdown: true
          cache: true

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-path: "pyproject.toml"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install -U pip
          python -m pip install .[test,pyside,remote,anywidget,examples,graph]

      # spatial-graph compiles a Cython/C++ module the first time each graph or
      # rtree configuration is used. With nothing cached that is 30 to 50 s a
      # job, all of it charged to whichever tests come first
      # (test_roi_edge_pick_resolves_the_row_on_demand and
      # test_mask_and_roi_agree[1-1-extent0]). witty finds a module by the hash
      # of its source, so a stale cache only means compiling again. The key
      # holds the versions the modules were built against; a new version starts
      # from the last cache of the same Python and adds to it.
      - name: Compiled graph modules - versions
        id: witty
        shell: bash
        run: |
          python -c "
          import hashlib, sys
          from importlib.metadata import version
          v = ' '.join(f'{p}={version(p)}' for p in ('spatial-graph', 'witty', 'cython', 'numpy'))
          print(v, file=sys.stderr)
          print('versions=' + hashlib.sha256((v + sys.version).encode()).hexdigest()[:16])
          " >> "$GITHUB_OUTPUT"

      - name: Restore compiled graph modules
        uses: actions/cache@v6
        with:
          path: .witty_cache
          key: witty-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-${{ steps.witty.outputs.versions }}
          restore-keys: |
            witty-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-

      # The render tests skip themselves when no adapter resolves, so a backend
      # that fails to load would turn ~450 tests into a silent green. Fail here
      # instead, and log which adapter each platform actually picked.
      - name: Verify wgpu adapter
        shell: bash
        run: |
          python -c "from pygfx.renderers.wgpu import get_shared; print('adapter:', get_shared().device.adapter.summary)"

      # Two jobs on the same code have differed by 1.6 times. This logs what
      # could explain it: the CPU the runner drew, a fixed piece of work timed
      # on it, and the coverage core (pytest's header repeats the core the run
      # itself uses).
      - name: Machine and coverage core
        shell: bash
        run: python scripts/ci_profiling/machine_info.py

      - name: 🧪 Run Tests
        run: pytest --color=yes --durations=25 --cov --cov-report=xml --cov-report=term-missing

      - name: Coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  deploy:
    name: Deploy
    needs: test
    if: success() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing on PyPi
      # see https://docs.pypi.org/trusted-publishers/
      id-token: write
      # This permission allows writing releases
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: 👷 Build
        run: |
          python -m pip install build
          python -m build

      - name: 🚢 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: './dist/*'
