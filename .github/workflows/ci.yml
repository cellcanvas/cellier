name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
  

# cancel in-progress runs that use the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-manifest:
    # check-manifest is a tool that checks that all files in version control are
    # included in the sdist (unless explicitly excluded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx run check-manifest

  test:
    name: ${{ matrix.platform }} (${{ matrix.python-version }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        platform: [ubuntu-latest, macos-latest, windows-latest]

    env:
      # Pin Windows to Vulkan/lavapipe, matching the lavapipe setup ubuntu already
      # uses. The other two Windows backends are both broken for us: the Mesa
      # OpenGL adapter (installed by setup-headless-display-action, and preferred
      # by wgpu because D3D12/WARP reports device type "CPU") samples 1D float32
      # colormap textures as black, and D3D12 falls back to the FXC shader
      # compiler, which cannot compile the MIP shader's dynamic array indexing.
      # Empty elsewhere, which wgpu treats as unset.
      WGPU_BACKEND_TYPE: ${{ matrix.platform == 'windows-latest' && 'Vulkan' || '' }}

      # Put pytest's tmp_path in the workspace (D:) on Windows. The default,
      # the temp directory on C:, takes about 7 ms to sync a file, and the
      # render tests write a few hundred zarr chunks each: 1.4 s a pyramid
      # against 0.5 s here (scripts/ci_profiling/ci_profiling_investigation.md).
      # A relative path, because pytest splits this like a shell would and a
      # Windows path's backslashes would not survive.
      PYTEST_ADDOPTS: ${{ matrix.platform == 'windows-latest' && '--basetemp=.pytest_basetemp' || '' }}

      # Where spatial-graph (through witty) keeps the C++ modules it compiles on
      # first use; saved between runs by the "Restore compiled graph modules"
      # step below.
      WITTY_CACHE_DIR: ${{ github.workspace }}/.witty_cache

      # spatial-graph >=0.1.0 ships prebuilt rtree wheels,
      # but I was getting incompatible CPython errors.
      SPATIAL_GRAPH_NO_PREBUILT: "1"

      # An experiment on the Windows hang: llvmpipe (lavapipe) compiles shaders
      # for the host CPU, and the hung jobs were on AVX-512 runners (5 of 6;
      # the AVX2-only EPYC 7763 passed 2 of 2). "avx" keeps AVX and AVX2 and
      # takes AVX-512 away from the JIT. "Machine and coverage core" logs
      # whether the runner has AVX-512 (scripts/ci_profiling/
      # ci_profiling_investigation.md, "The Windows hang in create_texture").
      # Empty elsewhere, which Mesa treats as no override.
      GALLIUM_OVERRIDE_CPU_CAPS: ${{ matrix.platform == 'windows-latest' && 'avx' || '' }}

    steps:
      - uses: actions/checkout@v7

      # The Ubuntu packages install from a cache of their .deb files. The Azure
      # Ubuntu mirror has served the Mesa packages at ~36 kB/s for minutes on
      # end (8 to 9 minutes a job on PR 130), which apt's timeouts cannot cut
      # short: they fire only when no bytes arrive. With the files cached, apt
      # downloads only what changed since the last save. The cache is keyed by
      # the release and the files it holds, so a new package version is saved
      # alongside the rest and autoclean drops the superseded one.
      - name: apt cache key
        if: matrix.platform == 'ubuntu-latest'
        id: apt-key
        run: echo "prefix=apt-debs-$(. /etc/os-release && echo "$VERSION_CODENAME")-${{ runner.arch }}-" >> "$GITHUB_OUTPUT"

      - name: Restore apt packages
        if: matrix.platform == 'ubuntu-latest'
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.apt-key.outputs.prefix }}latest
          restore-keys: ${{ steps.apt-key.outputs.prefix }}

      # This also installs the headless display action's Linux packages, so its
      # own apt-get install below finds nothing to download (only its index
      # refresh repeats). The list is the action's for v5 with qt: true and no
      # window manager; if it drifts, the action fetches the difference itself.
      - name: Install llvmpipe, lavapipe and the headless display's packages
        if: matrix.platform == 'ubuntu-latest'
        id: apt-install
        run: |
          archives="$RUNNER_TEMP/apt-archives"
          mkdir -p "$archives/partial"
          # A hard stall falls back to the next mirror after 20 s, not apt's
          # default 120 s. Downloads run as root: the _apt user cannot write
          # to the runner's temp directory.
          opts=(
            -o APT::Sandbox::User=root
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
            -o DPkg::Lock::Timeout=120
            -o Dpkg::Options::=--force-unsafe-io
            -o Dir::Cache::Archives="$archives"
          )
          packages=(
            # llvmpipe and lavapipe for the offscreen canvas
            libegl1-mesa-dev libgl1-mesa-dri libxcb-xfixes0-dev mesa-vulkan-drivers
            # pyvista/setup-headless-display-action@v5, qt: true, wm: false
            libglx-mesa0 libgl1 xvfb x11-xserver-utils
            libdbus-1-3 libegl1 libopengl0 libosmesa6 libpulse0
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0
            libxcb-xinerama0 libxcb-xinput0 libxkbcommon-x11-0 mesa-utils x11-utils
          )
          echo "restored $(ls "$archives"/*.deb 2>/dev/null | wc -l) cached .deb files"
          sudo timeout 5m apt-get update -qq "${opts[@]}"
          sudo env DEBIAN_FRONTEND=noninteractive timeout 15m \
            apt-get install -y "${opts[@]}" "${packages[@]}"
          # Drop superseded versions, and hand the rest to the runner user so
          # the cache can archive them.
          sudo apt-get autoclean -qq "${opts[@]}"
          sudo rm -rf "$archives/partial" "$archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$archives"
          files_hash=$(cd "$archives" && ls *.deb | sha256sum | cut -c1-16)
          echo "key=${{ steps.apt-key.outputs.prefix }}${files_hash}" >> "$GITHUB_OUTPUT"

      # Saved straight away rather than at the end of the job, so a failing
      # test run still keeps the downloads.
      - name: Save apt packages
        if: >-
          matrix.platform == 'ubuntu-latest'
          && steps.apt-install.outputs.key != steps.apt-cache.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.apt-install.outputs.key }}

      # On Windows this exports LP_NUM_THREADS=0 (install-mesa3d-offscreen,
      # on by default), so lavapipe rasterises on the calling thread. Turning
      # it off gained about 1% of render-test time (scripts/ci_profiling/
      # ci_profiling_investigation.md, "Threaded lavapipe on Windows, tried").
      # The hang in create_texture seen then is not the thread count: it came
      # back with it on ("The Windows hang in create_texture", same file).
      - name: Set up headless GUI
        uses: pyvista/setup-headless-display-action@v5
        with:
          qt: true

      # The windows runners ship no Vulkan driver (the loader is there, but finds
      # no ICD). This installs lavapipe and registers its ICD under
      # HKLM\SOFTWARE\Khronos\Vulkan\Drivers, so WGPU_BACKEND_TYPE=Vulkan resolves.
      - name: Install lavapipe for offscreen canvas
        if: matrix.platform == 'windows-latest'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_lavapipe: true
          stripdown: true
          cache: true

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-path: "pyproject.toml"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install -U pip
          python -m pip install .[test,pyside,remote,anywidget,examples,graph]

      # spatial-graph compiles a Cython/C++ module the first time each graph or
      # rtree configuration is used. With nothing cached that is 30 to 50 s a
      # job, all of it charged to whichever tests come first
      # (test_roi_edge_pick_resolves_the_row_on_demand and
      # test_mask_and_roi_agree[1-1-extent0]). witty finds a module by the hash
      # of its source, so a stale cache only means compiling again. The key
      # holds the versions the modules were built against; a new version starts
      # from the last cache of the same Python and adds to it.
      - name: Compiled graph modules - versions
        id: witty
        shell: bash
        run: |
          python -c "
          import hashlib, sys
          from importlib.metadata import version
          v = ' '.join(f'{p}={version(p)}' for p in ('spatial-graph', 'witty', 'cython', 'numpy'))
          print(v, file=sys.stderr)
          print('versions=' + hashlib.sha256((v + sys.version).encode()).hexdigest()[:16])
          " >> "$GITHUB_OUTPUT"

      - name: Restore compiled graph modules
        uses: actions/cache@v6
        with:
          path: .witty_cache
          key: witty-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-${{ steps.witty.outputs.versions }}
          restore-keys: |
            witty-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-

      # The render tests skip themselves when no adapter resolves, so a backend
      # that fails to load would turn ~450 tests into a silent green. Fail here
      # instead, and log which adapter each platform actually picked.
      - name: Verify wgpu adapter
        shell: bash
        run: |
          python -c "from pygfx.renderers.wgpu import get_shared; print('adapter:', get_shared().device.adapter.summary)"

      # Two jobs on the same code have differed by 1.6 times. This logs what
      # could explain it: the CPU the runner drew, a fixed piece of work timed
      # on it, and the coverage core (pytest's header repeats the core the run
      # itself uses).
      - name: Machine and coverage core
        shell: bash
        run: python scripts/ci_profiling/machine_info.py

      # Native stacks of a test that hangs ("The Windows hang in
      # create_texture", scripts/ci_profiling/ci_profiling_investigation.md).
      # tests/_native_dump.py dumps a test still running at 200 s and 400 s,
      # before faulthandler's dump at 300 s and pytest-timeout's exit at 600 s,
      # with py-spy (the Python threads, native frames too) and cdb (every
      # thread, lavapipe's included; the Windows Server 2025 image has it).
      # wgpu-native's symbols come from its release, whose DLL the wgpu wheel
      # ships unchanged; the debuggers find a .pdb next to its DLL. Lavapipe
      # comes without symbols, so its frames read as export + offset.
      - name: Native stack dump tools
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          python -m pip install py-spy
          echo "CELLIER_NATIVE_DUMP_AFTER=200,400" >> "$GITHUB_ENV"
          cdb="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          if [ -f "$cdb" ]; then
            echo "CELLIER_CDB=$(cygpath -w "$cdb")" >> "$GITHUB_ENV"
          else
            echo "::warning::cdb.exe not found: native dumps will be py-spy's only"
          fi
          tag=v$(python -c "import wgpu.backends.wgpu_native as w; print(w.__version__)")
          resources=$(python -c "import os, wgpu; print(os.path.join(os.path.dirname(wgpu.__file__), 'resources'))")
          url="https://github.com/gfx-rs/wgpu-native/releases/download/$tag/wgpu-windows-x86_64-msvc-release.zip"
          zip="$(cygpath -u "$RUNNER_TEMP")/wgpu-native.zip"
          if curl -sSfL --retry 3 -o "$zip" "$url" \
            && 7z e -y "$(cygpath -w "$zip")" lib/wgpu_native.pdb -o"$resources" > /dev/null; then
            ls -l "$(cygpath -u "$resources")"
          else
            echo "::warning::no wgpu-native symbols from $url"
          fi
          # cdb's own default (srv*) does not look next to the DLL, so name the
          # folder; Microsoft's server still serves the system DLLs.
          echo "CELLIER_CDB_SYMBOLS=srv*$RUNNER_TEMP\\symbols*https://msdl.microsoft.com/download/symbols;$resources" >> "$GITHUB_ENV"

      # The AVX-512 experiment on one machine: the slab cases the jobs hung in,
      # in fresh processes, with GALLIUM_OVERRIDE_CPU_CAPS=avx and without it,
      # alternating, each killed at 90 s (a pass takes seconds). The outcomes go
      # to the log, the job summary and an artifact. It never fails the job;
      # the main run below keeps the override either way.
      - name: AVX-512 A/B
        if: matrix.platform == 'windows-latest'
        continue-on-error: true
        timeout-minutes: 25
        run: python scripts/ci_profiling/avx512_ab.py --rounds 5 --timeout 90 --out avx512_ab/ab.json

      - name: Upload AVX-512 A/B
        if: always() && matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: avx512-ab-py${{ matrix.python-version }}
          path: avx512_ab/
          if-no-files-found: ignore
          retention-days: 14

      # A run that hangs (in the driver, or on exit) fails here, not at the
      # 6 hour job limit.
      - name: 🧪 Run Tests
        timeout-minutes: 45
        run: pytest --color=yes --durations=25 --cov --cov-report=xml --cov-report=term-missing

      # What "Native stack dump tools" caught, in the log and as an artifact
      # (the .dmp minidumps open in WinDbg).
      - name: Native stack dumps
        if: failure() && matrix.platform == 'windows-latest'
        shell: bash
        run: |
          shopt -s nullglob
          files=(native_dumps/*.txt)
          [ ${#files[@]} -gt 0 ] || { echo "no native dumps"; exit 0; }
          for f in "${files[@]}"; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

      - name: Upload native stack dumps
        if: failure() && matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: native-dumps-py${{ matrix.python-version }}
          path: native_dumps/
          if-no-files-found: ignore
          retention-days: 14

      - name: Coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  deploy:
    name: Deploy
    needs: test
    if: success() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing on PyPi
      # see https://docs.pypi.org/trusted-publishers/
      id-token: write
      # This permission allows writing releases
      contents: write
      # This permission allows starting the docs workflow (last step)
      actions: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: 👷 Build
        run: |
          python -m pip install build
          python -m build

      - name: 🚢 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: './dist/*'

      # The docs workflow publishes the example scripts of each release,
      # pinned to that release, and leaves out a version that is not on PyPI
      # (see plans/examples-distribution-v2.md). So wait until this one is
      # there before starting it. The version is read from the sdist's name,
      # which is the form PyPI knows it by (tag v0.1.0-rc1 is 0.1.0rc1).
      - name: Wait for the release on PyPI
        run: |
          sdist=$(basename dist/cellier-*.tar.gz .tar.gz)
          version="${sdist#cellier-}"
          for _ in $(seq 30); do
            if curl -fsS -o /dev/null "https://pypi.org/pypi/cellier/${version}/json"; then
              echo "cellier ${version} is on PyPI"
              exit 0
            fi
            sleep 10
          done
          echo "cellier ${version} did not appear on PyPI" >&2
          exit 1

      # The site can only be deployed from main, so the docs workflow is
      # started there rather than run on this tag.
      - name: Rebuild the docs site with this release's examples
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "${{ github.repository }}" --ref main
