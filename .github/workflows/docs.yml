name: Documentation

# Builds the docs and adds the example scripts of every release, pinned to
# that release (see plans/examples-distribution-v2.md). The whole site is
# rebuilt on each run, so nothing is kept from the previous deploy.
#
# workflow_dispatch is how the release job in ci.yml starts this after a new
# version is on PyPI.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history, so the release tags are there to read the examples from.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - run: pip install zensical
      - run: pip install mkdocstrings mkdocstrings-python "griffe-pydantic>=1.3.1"
      - run: zensical build --clean

      # Writes site/<tag>/examples/ and site/latest/examples/. On a pull
      # request it also fails if an example in the branch could not be pinned.
      - run: pip install packaging
      - name: Add the released examples
        run: >-
          python scripts/example_upload/assemble_example_site.py site
          ${{ github.event_name == 'pull_request' && '--working-tree-version 0.0.0' || '' }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # One deploy at a time; a deploy that has started is left to finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
